<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - CodeHarbour Tools</title>

<script src="config.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#1e293b;
padding:30px;
border-radius:12px;
width:350px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
<h1>Create Account</h1>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="signupBtn">
Create Account
</button>

<p id="message"></p>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
window.SUPABASE_URL,
window.SUPABASE_ANON_KEY
);

document
.getElementById("signupBtn")
.addEventListener("click", async () => {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const { error } =
await supabase.auth.signUp({
email,
password
});

if(error){
document.getElementById("message")
.textContent = error.message;
return;
}

document.getElementById("message")
.textContent =
"Account created. Check your email.";

});

</script>

</body>
</html>
